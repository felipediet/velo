# Workflow responsável por executar os testes unitários a cada push na branch main.
# Estrutura preparada para receber novos jobs (ex: e2e, lint, build) no futuro.

name: Continuous Deployment

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '22'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: felipe-diet-s-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Obter as configurações do Vercel para o projeto
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel
      - name: Build for Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy Preview para o Vercel
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
            echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: End-to-End Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes end-to-end com Playwright
      - name: Run E2E Tests
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
        run: yarn playwright test --reporter=github,junit,html

      # 6. Garante uma página mesmo quando o relatório HTML não é gerado
      - name: Publish Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # 7. Exibe link do relatório no summary da execução
      - name: Add report link to summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Playwright Report"
            echo ""
            echo "Publicação concluída com sucesso."
            echo ""
            echo "Clique no link abaixo para ver o relatório:"
            echo ""
            echo "- https://felipediet.github.io/velo/"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to Production
    needs: [e2e-tests, build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # 1. Promove a implantação para produção no Vercel
      - name: Promote to Production
        run: yarn vercel promote ${{ needs.build-and-deploy.outputs.deployment-url }} \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes