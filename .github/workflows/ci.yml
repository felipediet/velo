# Workflow responsável por executar os testes unitários a cada push na branch main.
# Estrutura preparada para receber novos jobs (ex: e2e, lint, build) no futuro.

name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: felipe-diet-s-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Obter as configurações do Vercel para o projeto
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel
      - name: Build for Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy Preview para o Vercel
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: End-to-End Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes end-to-end com Playwright
      - name: Run E2E Tests
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: yarn playwright test playwright/e2e/online.spec.ts --reporter=github,junit,html

      # 6. Garante uma página mesmo quando o relatório HTML não é gerado
      - name: Ensure Pages Content
        if: ${{ always() }}
        run: |
          mkdir -p playwright-report
          if [ ! -f playwright-report/index.html ]; then
            cat > playwright-report/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Playwright Report</title>
          </head>
          <body>
            <h1>Playwright report not available</h1>
            <p>The HTML report was not generated for this run. Check workflow logs and artifacts.</p>
          </body>
          </html>
          HTML
          fi

      # 7. Publica resumo no Step Summary
      - name: Publish E2E Step Summary
        if: ${{ always() }}
        run: |
          REPORT_FILE="playwright-report/results.xml"

          {
            echo "## Playwright E2E Summary"
            echo ""
            echo "- Deployment URL under test: ${{ needs.build-and-deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$REPORT_FILE" ]; then
            {
              echo ""
              echo "- Warning: JUnit report not found at $REPORT_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('playwright-report/results.xml', 'utf8');
          const total = (xml.match(/<testcase\b/g) || []).length;
          const failed = (xml.match(/<failure\b/g) || []).length;
          const skipped = (xml.match(/<skipped\b/g) || []).length;
          const passed = Math.max(total - failed - skipped, 0);
          const successRate = total > 0 ? ((passed / total) * 100).toFixed(1) : '0.0';

          const lines = [
            '',
            '| Metric | Value |',
            '|---|---:|',
            `| Total | ${total} |`,
            `| Passed | ${passed} |`,
            `| Failed | ${failed} |`,
            `| Skipped | ${skipped} |`,
            `| Success Rate | ${successRate}% |`,
            ''
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE

      # 8. Salva o relatório como artifact do GitHub Actions
      - name: Upload E2E Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/

  publish-playwright-report-history:
    name: Publish Playwright Report History
    needs: [e2e-tests, build-and-deploy]
    if: ${{ always() && needs.e2e-tests.result != 'cancelled' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository default branch
        uses: actions/checkout@v6.0.2
        with:
          path: repo

      - name: Ensure gh-pages branch exists
        run: |
          cd repo
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "gh-pages branch already exists"
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            echo "<!doctype html><title>Playwright Report History</title><h1>Playwright Report History</h1>" > index.html
            git add index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: initialize gh-pages"
            git push origin gh-pages
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v6.0.2
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Playwright Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report

      - name: Prepare report history site
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail

          mkdir -p gh-pages/reports

          REPORT_DIR="gh-pages/reports/run-${RUN_NUMBER}-${RUN_ID}"
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          cp -R playwright-report/. "$REPORT_DIR/"

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > "$REPORT_DIR/meta.json" <<JSON
          {
            "runId": "${RUN_ID}",
            "runNumber": "${RUN_NUMBER}",
            "runAttempt": "${RUN_ATTEMPT}",
            "sha": "${SHA}",
            "commitUrl": "${COMMIT_URL}",
            "runUrl": "${RUN_URL}",
            "deploymentUrl": "${DEPLOYMENT_URL}",
            "publishedAt": "${TIMESTAMP}",
            "path": "reports/run-${RUN_NUMBER}-${RUN_ID}/"
          }
          JSON

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const rootDir = path.join(process.cwd(), 'gh-pages');
          const reportsDir = path.join(rootDir, 'reports');

          const entries = fs.readdirSync(reportsDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => {
              const metaPath = path.join(reportsDir, entry.name, 'meta.json');
              if (!fs.existsSync(metaPath)) return null;
              return JSON.parse(fs.readFileSync(metaPath, 'utf8'));
            })
            .filter(Boolean)
            .sort((a, b) => Number(b.runNumber) - Number(a.runNumber) || Number(b.runId) - Number(a.runId));

          const rows = entries.map((entry) => {
            const deploymentCell = entry.deploymentUrl
              ? `<a href="${entry.deploymentUrl}">${entry.deploymentUrl}</a>`
              : '-';

            return `
              <tr>
                <td><a href="${entry.path}">Run #${entry.runNumber}</a></td>
                <td>${entry.runAttempt}</td>
                <td><a href="${entry.runUrl}">workflow</a></td>
                <td><a href="${entry.commitUrl}"><code>${entry.sha.slice(0, 7)}</code></a></td>
                <td>${deploymentCell}</td>
                <td>${entry.publishedAt}</td>
              </tr>`;
          }).join('\n');

          const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Playwright Report History</title>
            <style>
              :root {
                color-scheme: light dark;
                font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              }
              body {
                margin: 0;
                padding: 32px;
                background: #0b1020;
                color: #e5e7eb;
              }
              main {
                max-width: 1100px;
                margin: 0 auto;
              }
              h1 {
                margin-bottom: 8px;
              }
              p {
                color: #cbd5e1;
              }
              table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 24px;
                background: rgba(15, 23, 42, 0.85);
                border: 1px solid rgba(148, 163, 184, 0.25);
              }
              th, td {
                padding: 12px 14px;
                border-bottom: 1px solid rgba(148, 163, 184, 0.18);
                text-align: left;
                vertical-align: top;
              }
              th {
                background: rgba(30, 41, 59, 0.95);
              }
              a {
                color: #93c5fd;
              }
              code {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Playwright Report History</h1>
              <p>Histórico dos relatórios E2E publicados automaticamente pelo GitHub Actions.</p>
              <table>
                <thead>
                  <tr>
                    <th>Run</th>
                    <th>Attempt</th>
                    <th>Workflow</th>
                    <th>Commit</th>
                    <th>Preview URL</th>
                    <th>Published at (UTC)</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </main>
          </body>
          </html>`;

          fs.writeFileSync(path.join(rootDir, 'index.html'), html);
          NODE

      - name: Commit report history
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: publish playwright report for run ${{ github.run_number }}"
          git push origin HEAD:gh-pages