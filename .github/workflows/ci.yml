# Workflow responsável por executar os testes unitários a cada push na branch main.
# Estrutura preparada para receber novos jobs (ex: e2e, lint, build) no futuro.

name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: felipe-diet-s-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test
  
  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Obter as configuraçoes do Vercel para o projeto
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      
      # 6. Build para o Vercel
      - name: Build for Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy Preview para o Vercel
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: End-to-End Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # 2. Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # 5. Executa os testes end-to-end com Playwright
      - name: Run E2E Tests
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-report/results.xml
        run: yarn playwright test playwright/e2e/online.spec.ts --reporter=github,junit,html

      # 6. Publica o resumo dos testes no dashboard/checks do GitHub Actions
      - name: Publish E2E Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Playwright E2E Results
          path: playwright-report/results.xml
          reporter: java-junit
          fail-on-error: false
        
      # 7. Relatório HTML dos testes end-to-end
      - name: Upload E2E Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/