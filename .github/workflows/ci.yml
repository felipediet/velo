# Workflow responsável por executar os testes unitários a cada push na branch main.
# Estrutura preparada para receber novos jobs (ex: e2e, lint, build) no futuro.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz o checkout do repositório
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Configura o Node.js na versão definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test
