name: Docker + Playwright Tests
on:
#   push:
#     branches: [ main, master ]
#   pull_request:
#     branches: [ main, master ]
  workflow_dispatch:
jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: corepack enable && yarn install --frozen-lockfile

    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps

    - name: Build Docker image (VELO)
      run: docker build -t velo-web:e2e .

    - name: Start VELO container
      run: docker run -d --name velo-web -p 5173:5173 velo-web:e2e

    - name: Wait for application
      run: |
        for i in {1..30}; do
          if curl -fsS http://localhost:5173/ > /dev/null; then
            echo "Application is up"
            exit 0
          fi
          sleep 2
        done
        echo "Application did not become ready in time"
        docker logs velo-web || true
        exit 1

    - name: Run Playwright tests
      run: yarn playwright test

    - name: Container logs on failure
      if: ${{ failure() }}
      run: docker logs velo-web || true

    - name: Stop container
      if: ${{ always() }}
      run: docker rm -f velo-web || true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-evidences
        path: test-results/
        retention-days: 30